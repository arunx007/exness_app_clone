<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1.0,maximum-scale=1.0,minimum-scale=1.0,user-scalable=no"
    />
    <title>TradingView Chart</title>
    <script src="charting_library/charting_library.standalone.js"></script>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #000000;
      }
      #tv_chart_container {
        width: 100%;
        height: 100%;
      }
      /* Keep custom trading buttons flush on the left inside legend containers. */
      #tv_chart_container [data-name='legend-source-item'] [data-name='legend-source-item-buttons'],
      #tv_chart_container [data-name='legend-source-item'] [data-name='legend-broker-buttons'],
      #tv_chart_container [class*='legend'] [class*='broker'] {
        margin-left: 0 !important;
        padding-left: 0 !important;
      }
      /* Hide native TradingView buy/sell UI (legend buttons). */
      #tv_chart_container [class*='buySell'],
      #tv_chart_container [class*='sellBuy'],
      #tv_chart_container [class*='brokerButton'],
      #tv_chart_container [class*='tradingButtons'],
      #tv_chart_container [class*='buy-sell'],
      #tv_chart_container [class*='buySellButtons'],
      #tv_chart_container [class*='legendBuySell'],
      #tv_chart_container [data-name='buy-sell-buttons'],
      #tv_chart_container [data-name='legend-buy-sell-buttons'],
      #tv_chart_container [data-name='legend-source-item-buttons'],
      #tv_chart_container [data-name='legend-broker-buttons'],
      #tv_chart_container [data-name='broker-button'],
      #tv_chart_container [data-name='trade-buttons'] {
        display: none !important;
        visibility: hidden !important;
        pointer-events: none !important;
        opacity: 0 !important;
        max-height: 0 !important;
        overflow: hidden !important;
      }
      /* Hide TradingView in-chart notification toasts ("order modified", etc.). */
      #tv_chart_container [data-name='toast'],
      #tv_chart_container [data-name='notification'],
      #tv_chart_container [data-name='notice'],
      #tv_chart_container [class*='toast'],
      #tv_chart_container [class*='notification'],
      #tv_chart_container [class*='messageList'],
      #tv_chart_container [class*='snackbar'] {
        display: none !important;
        visibility: hidden !important;
        pointer-events: none !important;
        opacity: 0 !important;
        max-height: 0 !important;
        overflow: hidden !important;
      }
      /* Hide symbol · interval · status row (e.g. BTCUSD · 15 · MT5). */
      #tv_chart_container [data-name='legend'],
      #tv_chart_container [data-name='legend-series-item'],
      #tv_chart_container [data-name='legend-source-item'] [data-name='legend-source-title'],
      #tv_chart_container [data-name='legend-source-item'] [class*='title'],
      #tv_chart_container [class*='pane-legend'],
      #tv_chart_container [class*='legend-'] [class*='titlesWrapper'],
      #tv_chart_container [class*='legend-'] [class*='titleWrapper'] {
        display: none !important;
        visibility: hidden !important;
        pointer-events: none !important;
        opacity: 0 !important;
        max-height: 0 !important;
        min-height: 0 !important;
        overflow: hidden !important;
      }
    </style>
  </head>
  <body>
    <div id="tv_chart_container"></div>
    <script>
      (function () {
        var container = document.getElementById('tv_chart_container');
        if (!container) return;

        var Side = { Buy: 1, Sell: -1 };
        var ConnectionStatus = { Connected: 1 };
        var OrderType = { Limit: 1, Market: 2, Stop: 3 };
        var OrderStatus = { Canceled: 1, Filled: 2, Working: 6 };
        var ParentType = { Order: 1, Position: 2 };

        function getQuery(name) {
          // iOS loads this file with params in the hash (file:// URLs cannot
          // carry a query string in WKWebView); Android uses a normal query.
          var source =
            (window.location.search || '') +
            '&' +
            (window.location.hash || '').replace(/^#/, '');
          var match = new RegExp('[?&]' + name + '=([^&#]*)').exec(source);
          return match ? decodeURIComponent(match[1].replace(/\+/g, ' ')) : '';
        }

        var initialInterval = getQuery('interval') || '15';
        var initialTheme = getQuery('theme') === 'light' ? 'light' : 'dark';
        var initialBackground =
          getQuery('background') || (initialTheme === 'light' ? '#FFFFFF' : '#000000');
        var initialPrice = Number(getQuery('price') || '0');
        var initialServerTimeOffset = parseInt(getQuery('serverTimeOffset'), 10);
        document.documentElement.style.background = initialBackground;
        document.body.style.background = initialBackground;
        (function applyAppBackgroundCss() {
          var style = document.createElement('style');
          style.id = 'app-chart-bg';
          style.textContent =
            'html,body,#tv_chart_container{background:' +
            initialBackground +
            ' !important;}' +
            '#tv_chart_container .chart-page,' +
            '#tv_chart_container .chart-container,' +
            '#tv_chart_container [class*="chart-container"],' +
            '#tv_chart_container [class*="layout__area"],' +
            '#tv_chart_container [class*="chart-markup-table"]{' +
            'background-color:' +
            initialBackground +
            ' !important;}';
          document.head.appendChild(style);
        })();
        var barStore = Object.create(null);
        var lastBars = Object.create(null);
        var pendingGetBars = Object.create(null);
        var liveSubscribers = Object.create(null);
        var nativeQuoteCache = Object.create(null);
        var quotePushCallbacks = [];
        var quoteSubUnsubs = Object.create(null);
        var brokerRealtimeSubscribers = Object.create(null);

        var orderCallbacks = Object.create(null);
        var modifyCallbacks = Object.create(null);
        var orderModifyCallbacks = Object.create(null);
        var orderCancelCallbacks = Object.create(null);
        var closePositionCallbacks = Object.create(null);
        var livePositions = [];
        var liveOrders = [];
        var PREVIEW_ORDER_ID = 'CHART_PREVIEW_ORDER';
        var previewOrder = null;
        /** Draggable TradingView order-line primitive (reliable on mobile WebView). */
        var previewOrderLine = null;
        var previewOrderLineReady = null;
        var previewSlOrderLine = null;
        var previewTpOrderLine = null;
        var previewSlOrderLineReady = null;
        var previewTpOrderLineReady = null;
        var PREVIEW_BRACKET_OFFSET = 0.004;
        var lastSyncedOrdersById = Object.create(null);
        var lastSyncedOrderSigById = Object.create(null);
        var lastSyncedPositionsById = Object.create(null);
        var activeResolution = initialInterval;
        window.__tvBridgeReady = false;
        var CHART_BRIDGE_VERSION = 'preview-broker-sltp-2026-07-30';
        /** True while user is dragging the native broker preview line. */
        var previewDragging = false;
        /** Set to true from the RN side to stream bridge diagnostics. */
        window.__chartBridgeDebug = window.__chartBridgeDebug || false;
        /** Native broker preview (TradeSync) — shows +SL/+TP on the order line. */
        window.__previewUsesOrderLine = false;

        function normalizeSymbolKey(symbol) {
          return String(symbol || '')
            .split('.')[0]
            .trim()
            .replace(/[macfhr]+$/i, '')
            .toUpperCase();
        }

        var tradingSymbol = (getQuery('tradingSymbol') || getQuery('symbol') || 'BTCUSD')
          .trim()
          .toUpperCase();
        var initialSymbol = normalizeSymbolKey(getQuery('symbol') || tradingSymbol || 'BTCUSD');
        window.__chartTradingLots = 0.01;

        function normalizeResolution(resolution) {
          var value = String(resolution || '');
          if (value === 'D') return '1D';
          if (value === 'W') return '1W';
          if (value === 'M') return '1M';
          return value;
        }

        function storeKey(symbol, resolution) {
          return normalizeSymbolKey(symbol) + '|' + normalizeResolution(resolution);
        }

        function lookupBars(symbol, resolution) {
          var key = storeKey(symbol, resolution);
          var bars = barStore[key];
          if (bars && bars.length) return bars;
          return [];
        }

        function toBar(candle) {
          return {
            time: Number(candle.time),
            open: Number(candle.open),
            high: Number(candle.high),
            low: Number(candle.low),
            close: Number(candle.close),
            volume: Number(candle.volume) || 0,
          };
        }

        function resolvePendingGetBars(key, bars) {
          var pending = pendingGetBars[key];
          if (!pending || !pending.length) return false;
          delete pendingGetBars[key];
          pending.forEach(function (req) {
            try {
              if (!bars || bars.length === 0) {
                req.onResult([], { noData: true });
                return;
              }
              var oldestBarTime = bars[0].time;
              var requestedToMs = req.periodParams ? Number(req.periodParams.to) * 1000 : Infinity;
              if (
                req.periodParams &&
                !req.periodParams.firstDataRequest &&
                Number.isFinite(requestedToMs) &&
                requestedToMs < oldestBarTime
              ) {
                req.onResult([], { noData: true });
                return;
              }
              req.onResult(bars, { noData: false });
            } catch (_) {}
          });
          return true;
        }

        function getIntervalMs(resolution) {
          var res = String(resolution || '15').toUpperCase();
          if (res === 'D' || res === '1D') return 86400000;
          if (res === 'W' || res === '1W') return 604800000;
          if (res === 'M' || res === '1M') return 2592000000;
          var mins = parseInt(res, 10);
          if (!isNaN(mins) && mins > 0) return mins * 60000;
          return 900000;
        }

        var brokerTimeOffsetMs =
          Number.isFinite(initialServerTimeOffset) && initialServerTimeOffset !== 0
            ? initialServerTimeOffset
            : 0;
        var brokerTimeOffsetSec = Math.floor(brokerTimeOffsetMs / 1000);
        var hasBrokerOffset = brokerTimeOffsetMs !== 0;

        function getChartInnerWindow() {
          try {
            var tv = window.tvWidget;
            if (!tv) return null;
            if (typeof tv._innerWindow === 'function') {
              var w = tv._innerWindow();
              if (w) return w;
            }
            if (tv._iFrame && tv._iFrame.contentWindow) {
              return tv._iFrame.contentWindow;
            }
            var iframe = document.querySelector('#tv_chart_container iframe');
            if (iframe && iframe.contentWindow) {
              return iframe.contentWindow;
            }
          } catch (_) {}
          return null;
        }

        function syncChartApiServerTime() {
          try {
            var innerWin = getChartInnerWindow();
            if (!innerWin) return;
            var offsetSec = Math.floor(brokerTimeOffsetMs / 1000);

            if (innerWin.ChartApiInstance) {
              innerWin.ChartApiInstance.serverTime = function () {
                return Date.now() + brokerTimeOffsetMs;
              };
              if (innerWin.ChartApiInstance._studyEngine) {
                innerWin.ChartApiInstance._studyEngine.serverTime = function () {
                  return Date.now() + brokerTimeOffsetMs;
                };
                innerWin.ChartApiInstance._studyEngine._serverTimeOffset = offsetSec;
              }
            }
          } catch (_) {}
        }

        function updateBrokerOffset(barTimeMs, resolution, explicitOffsetMs) {
          if (
            Number.isFinite(explicitOffsetMs) &&
            explicitOffsetMs !== 0 &&
            Math.abs(explicitOffsetMs) <= 86400000
          ) {
            brokerTimeOffsetMs = explicitOffsetMs;
            brokerTimeOffsetSec = Math.floor(explicitOffsetMs / 1000);
            hasBrokerOffset = true;
            syncChartApiServerTime();
            return;
          }
          if (!barTimeMs || !Number.isFinite(barTimeMs)) return;
          var now = Date.now();
          var res = String(resolution || '15').toUpperCase();
          var intervalMs = getIntervalMs(res);

          // For intraday resolutions <= 60m (1m, 5m, 15m, 30m, 60m):
          // The current bar opened at barTimeMs on the broker.
          // On client UTC, the corresponding interval bucket opened at Math.floor(now / intervalMs) * intervalMs.
          // The difference is the broker timezone offset relative to client UTC.
          if (intervalMs <= 3600000) {
            var clientBucketStart = Math.floor(now / intervalMs) * intervalMs;
            var rawDiffMs = barTimeMs - clientBucketStart;
            var roundedOffsetMs = Math.round(rawDiffMs / 1800000) * 1800000;
            if (Math.abs(roundedOffsetMs) <= 86400000) {
              brokerTimeOffsetMs = roundedOffsetMs;
              brokerTimeOffsetSec = Math.floor(roundedOffsetMs / 1000);
              hasBrokerOffset = true;
              syncChartApiServerTime();
              return;
            }
          }

          // For 4h or 1D: if offset is not yet established, estimate from barTimeMs
          if (!hasBrokerOffset) {
            var midPointBrokerTime = barTimeMs + Math.min(intervalMs / 2, 7200000);
            var estimatedDiff = midPointBrokerTime - now;
            var estimatedOffsetMs = Math.round(estimatedDiff / 3600000) * 3600000;
            if (Math.abs(estimatedOffsetMs) <= 86400000) {
              brokerTimeOffsetMs = estimatedOffsetMs;
              brokerTimeOffsetSec = Math.floor(estimatedOffsetMs / 1000);
              hasBrokerOffset = true;
              syncChartApiServerTime();
            }
          }
        }

        function updateBrokerOffsetFromTick(tickTimeMs) {
          if (!tickTimeMs || !Number.isFinite(tickTimeMs)) return;
          var now = Date.now();
          var rawDiffMs = tickTimeMs - now;
          var roundedOffsetMs = Math.round(rawDiffMs / 1800000) * 1800000;
          if (Math.abs(roundedOffsetMs) <= 86400000) {
            brokerTimeOffsetMs = roundedOffsetMs;
            brokerTimeOffsetSec = Math.floor(roundedOffsetMs / 1000);
            hasBrokerOffset = true;
            syncChartApiServerTime();
          }
        }



        function ensureCountdownPatched() {
          try {
            var innerWin = getChartInnerWindow();
            if (!innerWin) return;
            var activeWidget =
              innerWin.chartWidgetCollection &&
              typeof innerWin.chartWidgetCollection.activeChartWidget === 'function'
                ? innerWin.chartWidgetCollection.activeChartWidget().value()
                : null;
            if (
              !activeWidget ||
              typeof activeWidget.hasModel !== 'function' ||
              !activeWidget.hasModel()
            ) {
              return;
            }
            var model = activeWidget.model();
            if (!model || typeof model.mainSeries !== 'function') return;
            var ms = model.mainSeries();
            if (!ms || !ms._priceAxisView) return;

            var proto = Object.getPrototypeOf(ms._priceAxisView);
            if (proto && !proto.__patchedCountdown) {
              proto.__patchedCountdown = true;
              var origProto = proto._countdownText;
              proto._countdownText = function () {
                var txt = origProto ? origProto.call(this) : '';
                if (txt) return txt;
                try {
                  var res = this._source.interval();
                  var intervalMs = getIntervalMs(res);
                  if (!intervalMs || intervalMs >= 86400000) return '';
                  var nowMs = Date.now() + brokerTimeOffsetMs;
                  var nextClose = Math.ceil(nowMs / intervalMs) * intervalMs;
                  var diffSec = Math.max(0, Math.floor((nextClose - nowMs) / 1000));
                  var mins = Math.floor(diffSec / 60);
                  var secs = diffSec % 60;
                  var pad = function (n) {
                    return (n < 10 ? '0' : '') + n;
                  };
                  if (mins >= 60) {
                    var hrs = Math.floor(mins / 60);
                    mins = mins % 60;
                    return pad(hrs) + ':' + pad(mins) + ':' + pad(secs);
                  }
                  return pad(mins) + ':' + pad(secs);
                } catch (_) {
                  return '';
                }
              };
            }

            if (ms.properties && ms.properties().childs) {
              var p = ms.properties().childs();
              if (p.showCountdown && typeof p.showCountdown.setValue === 'function') {
                p.showCountdown.setValue(true);
              }
            }
            if (ms._priceAxisView._options) {
              ms._priceAxisView._options.showCountdown = true;
              ms._priceAxisView._options.alwaysShowGlobalLast = true;
            }
            if (typeof ms._priceAxisView.updateCountdown === 'function') {
              ms._priceAxisView.updateCountdown();
            }
            if (typeof model.updateSourcePriceScale === 'function') {
              model.updateSourcePriceScale(ms);
            }
          } catch (_) {}
        }

        function triggerCountdownTick() {
          try {
            syncChartApiServerTime();
            ensureCountdownPatched();
          } catch (_) {}
        }

        if (!window.__countdownTickerTimer) {
          window.__countdownTickerTimer = setInterval(triggerCountdownTick, 1000);
        }

        function applyHistory(symbol, resolution, candles, explicitOffsetMs) {
          var normSymbol = normalizeSymbolKey(symbol);
          var normResolution = normalizeResolution(resolution);
          var key = storeKey(normSymbol, normResolution);
          var bars = (candles || [])
            .map(toBar)
            .filter(function (bar) {
              return Number.isFinite(bar.time) && bar.time > 0 && Number.isFinite(bar.close);
            })
            .sort(function (a, b) {
              return a.time - b.time;
            });
          barStore[key] = bars;
          if (bars.length > 0) {
            lastBars[normSymbol] = bars[bars.length - 1];
            updateBrokerOffset(bars[bars.length - 1].time, normResolution, explicitOffsetMs);
          }
          resolvePendingGetBars(key, bars);
        }

        function applyUpdate(symbol, resolution, candle, explicitOffsetMs) {
          var normSymbol = normalizeSymbolKey(symbol);
          var bar = toBar(candle);
          if (!Number.isFinite(bar.time) || bar.time <= 0) return;
          lastBars[normSymbol] = bar;
          updateBrokerOffset(bar.time, resolution, explicitOffsetMs);
          Object.keys(liveSubscribers).forEach(function (guid) {
            var sub = liveSubscribers[guid];
            if (!sub) return;
            if (storeKey(sub.symbol, sub.resolution) !== storeKey(symbol, resolution)) return;
            try {
              sub.onTick(bar);
            } catch (_) {}
          });
        }

        function tickLiveBarFromQuote(norm, price) {
          if (!price) return;
          var lastBar = lastBars[norm];
          if (!lastBar) return;
          var nowServerMs = Date.now() + (brokerTimeOffsetSec * 1000);

          Object.keys(liveSubscribers).forEach(function (guid) {
            var sub = liveSubscribers[guid];
            if (!sub) return;
            if (normalizeSymbolKey(sub.symbol) !== norm) return;

            var intervalMs = getIntervalMs(sub.resolution);
            var expectedBarTime = Math.floor(nowServerMs / intervalMs) * intervalMs;
            var targetBarTime = expectedBarTime > lastBar.time ? expectedBarTime : lastBar.time;

            var nextBar;
            if (targetBarTime > lastBar.time) {
              nextBar = {
                time: targetBarTime,
                open: price,
                high: price,
                low: price,
                close: price,
                volume: 1,
              };
            } else {
              nextBar = {
                time: lastBar.time,
                open: lastBar.open,
                high: Math.max(lastBar.high, price),
                low: Math.min(lastBar.low, price),
                close: price,
                volume: (lastBar.volume || 0) + 1,
              };
            }
            lastBars[norm] = nextBar;
            try {
              sub.onTick(nextBar);
            } catch (_) {}
          });
        }

        function applyQuote(quote) {
          if (!quote) return;
          var norm = normalizeSymbolKey(quote.symbol);
          var bid = Number(quote.bid) || 0;
          var ask = Number(quote.ask) || 0;
          nativeQuoteCache[norm] = {
            symbol: norm,
            bid: bid,
            ask: ask,
            lastValidBid: bid > 0 ? bid : quote.lastValidBid,
            lastValidAsk: ask > 0 ? ask : quote.lastValidAsk,
          };
          if (quote && Number.isFinite(quote.time) && quote.time > 0) {
            updateBrokerOffsetFromTick(quote.time);
          }
          var price = bid > 0 ? bid : ask > 0 ? ask : quote.lastValidBid || quote.lastValidAsk;
          tickLiveBarFromQuote(norm, price);
          quotePushCallbacks.slice().forEach(function (cb) {
            try {
              cb();
            } catch (_) {}
          });

          // Dispatch to TradingView's Broker Realtime Subscribers for Ask/Bid lines
          var spreadData = ensureBidAskSpread(bid, ask, norm);
          var brokerSubs = brokerRealtimeSubscribers[norm];
          if (brokerSubs && brokerSubs.length > 0) {
            brokerSubs.slice().forEach(function (cb) {
              try {
                cb(quote.symbol || norm, { bid: spreadData.bid, ask: spreadData.ask });
              } catch (_) {}
            });
          }
          Object.keys(brokerRealtimeSubscribers).forEach(function (k) {
            if (k !== norm && brokerRealtimeSubscribers[k] && brokerRealtimeSubscribers[k].length > 0) {
              brokerRealtimeSubscribers[k].slice().forEach(function (cb) {
                try {
                  cb(k, { bid: spreadData.bid, ask: spreadData.ask });
                } catch (_) {}
              });
            }
          });
        }

        window.__chartBridge = {
          applyHistory: applyHistory,
          applyUpdate: applyUpdate,
          applyQuote: applyQuote,
          applyBackground: function (background) {
            var bg = String(background || '').trim();
            if (!bg) return;
            document.documentElement.style.background = bg;
            document.body.style.background = bg;
            var style = document.getElementById('app-chart-bg');
            if (style) {
              style.textContent =
                'html,body,#tv_chart_container{background:' +
                bg +
                ' !important;}' +
                '#tv_chart_container .chart-page,' +
                '#tv_chart_container .chart-container,' +
                '#tv_chart_container [class*="chart-container"],' +
                '#tv_chart_container [class*="layout__area"],' +
                '#tv_chart_container [class*="chart-markup-table"]{' +
                'background-color:' +
                bg +
                ' !important;}';
            }
            try {
              var tv = window.tvWidget;
              var chart = tv && tv.activeChart && tv.activeChart();
              var overrides = {
                'paneProperties.background': bg,
                'paneProperties.backgroundType': 'solid',
                'scalesProperties.backgroundColor': bg,
              };
              if (chart && typeof chart.applyOverrides === 'function') {
                chart.applyOverrides(overrides);
              }
              if (tv && typeof tv.applyOverrides === 'function') {
                tv.applyOverrides(overrides);
              }
            } catch (_) {}
          },
          setOrderPreview: function (payload) {
            setOrderPreview(payload);
          },
        };

        function getPriceScale(symbol, price) {
          var upper = String(symbol || '').toUpperCase();
          if (upper.indexOf('BTC') >= 0 || upper.indexOf('ETH') >= 0 || price >= 1000) return 100;
          if (price >= 100) return 1000;
          return 100000;
        }

        function getSymbolDigits(symbol) {
          var upper = String(symbol || '').toUpperCase();
          if (upper.indexOf('BTC') >= 0 || upper.indexOf('ETH') >= 0) return 2;
          if (upper.indexOf('JPY') >= 0) return 3;
          return 5;
        }

        function ensureBidAskSpread(bid, ask, symbol) {
          var digits = getSymbolDigits(symbol);
          var tick = Math.pow(10, -digits);
          var b = Number.isFinite(bid) && bid > 0 ? bid : NaN;
          var a = Number.isFinite(ask) && ask > 0 ? ask : NaN;
          if (!Number.isFinite(b) && Number.isFinite(a)) b = a - tick;
          if (!Number.isFinite(a) && Number.isFinite(b)) a = b + tick;
          if (!Number.isFinite(b) || !Number.isFinite(a)) {
            var base = Number.isFinite(b) ? b : Number.isFinite(a) ? a : initialPrice || 1;
            b = base;
            a = base + tick;
          }
          if (a <= b) a = b + tick;
          return { bid: b, ask: a, spread: a - b };
        }

        function quoteKeysForSubscription(symbols, fastSymbols) {
          var seen = Object.create(null);
          var keys = [];
          var all = (symbols || []).concat(fastSymbols || []);
          for (var i = 0; i < all.length; i++) {
            var raw = all[i];
            if (!raw) continue;
            var norm = normalizeSymbolKey(raw);
            if (seen[norm]) continue;
            seen[norm] = true;
            keys.push({ raw: raw, norm: norm });
          }
          return keys;
        }

        function buildQuotePayload(symbolForChart, bid, ask) {
          var spreadInfo = ensureBidAskSpread(bid, ask, symbolForChart);
          var b = spreadInfo.bid;
          var a = spreadInfo.ask;
          var lp = (b + a) / 2;
          var digits = getSymbolDigits(symbolForChart);
          return {
            s: 'ok',
            n: symbolForChart,
            v: {
              bid: b,
              ask: a,
              lp: lp,
              spread: spreadInfo.spread,
              ch: 0,
              chp: 0,
              minmov: 1,
              pricescale: Math.pow(10, digits),
              short_name: symbolForChart,
              original_name: symbolForChart,
              description: symbolForChart,
            },
          };
        }

        function quotesFromKeys(keys) {
          return keys.map(function (entry) {
            var quote = nativeQuoteCache[entry.norm];
            var bid =
              (quote && (quote.bid || quote.lastValidBid)) ||
              initialPrice ||
              1;
            var askRaw = quote && (quote.ask || quote.lastValidAsk);
            var ask =
              askRaw != null && Number(askRaw) > 0
                ? Number(askRaw)
                : bid + Math.max(bid * 0.0002, Math.pow(10, -getSymbolDigits(entry.norm)));
            return buildQuotePayload(entry.raw, bid, ask);
          });
        }

        function postToNative(message) {
          if (!window.ReactNativeWebView) return;

        function forEachNodeDeep(root, visit) {
          if (!root) return;
          visit(root);
          var nodes = root.querySelectorAll ? root.querySelectorAll('*') : [];
          for (var i = 0; i < nodes.length; i += 1) {
            var node = nodes[i];
            visit(node);
            if (node.shadowRoot) {
              forEachNodeDeep(node.shadowRoot, visit);
            }
          }
        }

        function hideNodeTree(node) {
          if (!node || !node.style) return;
          node.style.setProperty('display', 'none', 'important');
          node.style.setProperty('visibility', 'hidden', 'important');
          node.style.setProperty('pointer-events', 'none', 'important');
          node.style.setProperty('height', '0', 'important');
          node.style.setProperty('max-height', '0', 'important');
          node.style.setProperty('overflow', 'hidden', 'important');
          node.style.setProperty('opacity', '0', 'important');
        }

        function hideChartLegend() {
          var root = document.getElementById('tv_chart_container');
          if (!root) return;
          var legendSelectors = [
            "[data-name='legend']",
            "[data-name='legend-series-item']",
            "[data-name='legend-source-title']",
            "[class*='pane-legend']",
            "[class*='titlesWrapper']",
          ];
          forEachNodeDeep(root, function (node) {
            if (!node || node.nodeType !== 1) return;
            for (var s = 0; s < legendSelectors.length; s += 1) {
              try {
                if (node.matches && node.matches(legendSelectors[s])) {
                  hideNodeTree(node);
                  break;
                }
              } catch (_) {}
            }
            if (node.getAttribute && node.getAttribute('data-name') === 'legend-source-item') {
              var title = node.querySelector("[data-name='legend-source-title']");
              if (title) hideNodeTree(title);
              var text = String(node.textContent || '').trim();
              if (
                text &&
                text.length < 80 &&
                (/\bMT5\b/i.test(text) || /·/.test(text)) &&
                !/\bBUY\b/i.test(text) &&
                !/\bSELL\b/i.test(text)
              ) {
                hideNodeTree(node);
              }
            }
          });
        }

        function hideNativeTradingButtons() {
          var host = window.__bridgeBrokerHost;
          if (host && typeof host.sellBuyButtonsVisibility === 'function') {
            var watched = host.sellBuyButtonsVisibility();
            if (watched && typeof watched.setValue === 'function') {
              watched.setValue(false);
            }
          }
          var root = document.getElementById('tv_chart_container');
          if (!root) return;
          var selectors = [
            "[class*='buySell']",
            "[class*='sellBuy']",
            "[class*='brokerButton']",
            "[class*='tradingButtons']",
            "[class*='buy-sell']",
            "[class*='buySellButtons']",
            "[class*='legendBuySell']",
            "[data-name='buy-sell-buttons']",
            "[data-name='legend-buy-sell-buttons']",
            "[data-name='legend-source-item-buttons']",
            "[data-name='legend-broker-buttons']",
            "[data-name='broker-button']",
            "[data-name='trade-buttons']",
            "[data-name='toast']",
            "[data-name='notification']",
            "[data-name='notice']",
            "[class*='toast']",
            "[class*='notification']",
            "[class*='messageList']",
            "[class*='snackbar']",
          ];
          forEachNodeDeep(root, function (node) {
            if (!node || node.nodeType !== 1) return;
            for (var s = 0; s < selectors.length; s += 1) {
              try {
                if (node.matches && node.matches(selectors[s])) {
                  hideNodeTree(node);
                  break;
                }
              } catch (_) {}
            }
          });

          var containerTop = root.getBoundingClientRect().top;
          forEachNodeDeep(root, function (node) {
            if (!node || node.nodeType !== 1 || !node.textContent) return;
            var text = String(node.textContent).trim().toUpperCase();
            if (!/\bBUY\b/.test(text) && !/\bSELL\b/.test(text)) return;
            var rect = node.getBoundingClientRect();
            if (!rect || rect.height <= 0 || rect.width <= 0) return;
            if (rect.top - containerTop > 150) return;
            if (rect.height > 72 || rect.width > 260) return;
            hideNodeTree(node);
            var parent = node.parentElement;
            for (var depth = 0; parent && depth < 6; depth += 1) {
              if (parent === root) break;
              hideNodeTree(parent);
              parent = parent.parentElement;
            }
          });

          // Fallback: remove TradingView bottom toasts by visible text content.
          var toastHints = [
            'ORDER MODIFIED',
            'ORDER PLACED',
            'TAKE PROFIT',
            'STOP LOSS',
            'BUY ',
            'SELL ',
          ];
          forEachNodeDeep(document.body || root, function (node) {
            if (!node || node.nodeType !== 1 || !node.textContent) return;
            var text = String(node.textContent).trim().toUpperCase();
            if (!text) return;
            var looksLikeToast = false;
            for (var i = 0; i < toastHints.length; i += 1) {
              if (text.indexOf(toastHints[i]) >= 0) {
                looksLikeToast = true;
                break;
              }
            }
            if (!looksLikeToast) return;
            var rect = node.getBoundingClientRect && node.getBoundingClientRect();
            if (!rect || rect.height <= 0 || rect.width <= 0) return;
            if (rect.height > 220 || rect.width > window.innerWidth * 0.98) return;
            hideNodeTree(node);
            var p = node.parentElement;
            for (var d = 0; p && d < 5; d += 1) {
              hideNodeTree(p);
              p = p.parentElement;
            }
          });
        }

        function removeDefaultVolumeIndicator() {

        widget.onChartReady(function () {

              try {
                var ms = readyChart.model && readyChart.model().mainSeries && readyChart.model().mainSeries();
                if (ms && ms.properties) {
                  var p = ms.properties().childs();
                  if (p.showCountdown && typeof p.showCountdown.setValue === 'function') {
                    p.showCountdown.setValue(true);

                  if (p.bidAsk && p.bidAsk.childs) {
                    var ba = p.bidAsk.childs();
                    if (ba.visible && typeof ba.visible.setValue === 'function') ba.visible.setValue(true);
                    if (ba.bidLineColor && typeof ba.bidLineColor.setValue === 'function') ba.bidLineColor.setValue('#1E88E5');
                    if (ba.askLineColor && typeof ba.askLineColor.setValue === 'function') ba.askLineColor.setValue('#EF4444');
                  }
                }
                if (ms && ms._priceAxisView) {
                  if (ms._priceAxisView._options) {
                    ms._priceAxisView._options.showCountdown = true;
                  }
                  var origCountdown = typeof ms._priceAxisView._countdownText === 'function' ? ms._priceAxisView._countdownText.bind(ms._priceAxisView) : null;
                  ms._priceAxisView._countdownText = function () {
                    var txt = origCountdown ? origCountdown() : '';
                    if (txt) return txt;
                    try {
                      var res = ms.interval();
                      var intervalMs = getIntervalMs(res);
                      if (!intervalMs || intervalMs >= 86400000) return '';
                      var nowMs = Date.now() + brokerTimeOffsetMs;
                      var nextClose = Math.ceil(nowMs / intervalMs) * intervalMs;
                      var diffSec = Math.max(0, Math.round((nextClose - nowMs) / 1000));
                      var mins = Math.floor(diffSec / 60);
                      var secs = diffSec % 60;
                      var pad = function (n) { return (n < 10 ? '0' : '') + n; };
                      if (mins >= 60) {
                        var hrs = Math.floor(mins / 60);
                        mins = mins % 60;
                        return pad(hrs) + ':' + pad(mins) + ':' + pad(secs);
                      }
                      return pad(mins) + ':' + pad(secs);
                    } catch (_) {
                      return '';
                    }
                  };
                }
              } catch (_) {}
            }
            if (typeof widget.applyOverrides === 'function') {
              widget.applyOverrides({
                'paneProperties.background': initialBackground,
                'paneProperties.backgroundType': 'solid',
                'scalesProperties.backgroundColor': initialBackground,
                'mainSeriesProperties.bidAsk.visible': true,
                'mainSeriesProperties.bidAsk.lineStyle': 2,
                'mainSeriesProperties.bidAsk.lineWidth': 1,
                'mainSeriesProperties.bidAsk.bidLineColor': '#1E88E5',
                'mainSeriesProperties.bidAsk.askLineColor': '#EF4444',
                'scalesProperties.showBidAskLabels': true,
                'mainSeriesProperties.showCountdown': true,
              });
            }
          } catch (_) {}

          setTimeout(function () {
            try {
              var innerWin = getChartInnerWindow();
              var activeWidget = innerWin && innerWin.chartWidgetCollection && innerWin.chartWidgetCollection.activeChartWidget && innerWin.chartWidgetCollection.activeChartWidget().value();
              var model = activeWidget && activeWidget.model && activeWidget.model();
              var hasCustom = model && model.hasCustomSource && model.hasCustomSource('bidask');
              var customSource = model && model.customSourceForName && model.customSourceForName('bidask');
              var bp = customSource && customSource.getPrice && customSource.getPrice(0);
              var ap = customSource && customSource.getPrice && customSource.getPrice(1);
              var ms = model && model.mainSeries && model.mainSeries();
              var p = ms && ms.properties && ms.properties().childs();
              var baVisible = p && p.bidAsk && p.bidAsk.childs && p.bidAsk.childs().visible && p.bidAsk.childs().visible.value();
              var scLabels = model && model.properties && model.properties().childs().scalesProperties.childs().showBidAskLabels.value();
              postToNative({
                type: 'BIDASK_DIAGNOSTIC',
                payload: {

                  hasSource: !!customSource,
                  bidPrice: bp,
                  askPrice: ap,
                  baVisible: baVisible,

                }
              });
            } catch (err) {
              postToNative({ type: 'BIDASK_DIAGNOSTIC', payload: { error: String(err) } });
            }
          }, 1500);
          if (!window.__hideTvTradingButtonsTimer) {
            window.__hideTvTradingButtonsTimer = setInterval(function () {
              hideChartLegend();
              hideNativeTradingButtons();
              removeDefaultVolumeIndicator();
            }, 500);
          }
          if (!window.__hideTvTradingObserver && typeof MutationObserver === 'function') {
            var observeRoot = document.getElementById('tv_chart_container');
            if (observeRoot) {

                hideNativeTradingButtons();

              window.__hideTvTradingObserver.observe(observeRoot, {
                childList: true,
                subtree: true,
              });
            }

          if (window.__nativeMessageQueue && window.__nativeMessageQueue.length) {
            window.__nativeMessageQueue.splice(0).forEach(function (raw) {
              handleNativeMessage(raw);
            });
          }

          var chart = widget.activeChart();
          try {
            if (chart && typeof chart.executeActionById === 'function') {
              chart.executeActionById('Trading.SellBuyButtonsToggleVisibility');
            }
          } catch (_) {}
          activeResolution = chart.resolution();

          chart.onIntervalChanged().subscribe(null, function (interval) {
            activeResolution = interval;
            var lastBar = lastBars[initialSymbol];
            if (lastBar) {
              updateBrokerOffset(lastBar.time, interval);

            triggerCountdownTick();
            postToNative({
              type: 'INTERVAL_CHANGED',
              payload: { resolution: interval },

          });

          chartSltpDebug('chart.ready.hooks', {
            hasOnOrderMove: !!(chart && typeof chart.onOrderMove === 'function'),
            positionCount: livePositions.length,
            positionIds: livePositions.map(function (p) {
              return String(p.id);
            }),
          });
          if (typeof chart.onOrderMove === 'function') {
            chart.onOrderMove().subscribe(null, function (order) {
              var id = order && order.id != null ? String(order.id) : '';
              var nextPrice = isPreviewOrderId(id)
                ? chartMainOrderDragPrice(order) ?? chartBracketDragLinePrice(order)
                : chartBracketDragLinePrice(order);
              chartSltpDebug('onOrderMove.event', {
                orderId: order && order.id,
                parentId: order && order.parentId,
                nextPrice: nextPrice,
                isPreview: isPreviewOrderId(id),
              });
              if (isPreviewOrderId(id)) {
                chartPreviewDebug('onOrderMove.preview', 'A', {
                  orderId: id,
                  nextPrice: nextPrice,
                });
              }
              if (nextPrice == null || !Number.isFinite(nextPrice)) return;
              chartLineOnOrderMove(order, nextPrice);
            });
          } else {
            chartSltpDebug('onOrderMove.unavailable', {});
            chartPreviewDebug('onOrderMove.unavailable', 'A', {});
          }

          postToNative({
            type: 'READY',
